name: Test allowed-conclusions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with custom allowed-conclusions (success, skipped, neutral).
      # This verifies the action accepts and parses the comma-separated list.
      # Under the harness, the sentinel repo causes the API call to fail,
      # so we allow either outcome and assert on graceful handling.
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: "success,skipped,neutral"
          fail-on-no-checks: "false"
          wait-interval: "5"
          checks-discovery-timeout: "10"
          verbose: "true"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom allowed-conclusions"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
